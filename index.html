<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMDZ Live TV</title>
<meta http-equiv="refresh" content="0; url=https://nlms-eta.vercel.app/">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #08090d;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
}
.spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(0, 229, 155, 0.18);
    border-top: 4px solid #00e59b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
h2 { margin: 0 0 10px 0; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; font-size: 0.95rem; color: #94a3b8; }
a { color: #00e59b; text-decoration: none; font-weight: 600; }
a:hover { text-decoration: underline; }
.manual-box { margin-top: 24px; }
</style>
<script>
const target = "https://nlms-eta.vercel.app/" + (window.location.search || "") + (window.location.hash || "");
window.location.replace(target);
</script>
</head>
<body>
<div class="spinner"></div>
<h2>Reindirizzamento a NMDZ Live...</h2>
<p>Connessione al server in corso...</p>
<div class="manual-box">
    <p>Se non vieni reindirizzato automaticamente: <a href="https://nlms-eta.vercel.app/">clicca qui per accedere</a></p>
</div>
</body>
</html>
